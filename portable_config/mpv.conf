# sosc - base mpv configuration

# uosc replaces the built-in on-screen controller
osc=no
osd-bar=no

# Palette chosen in the sosc palette picker (written by scripts/sosc-palettes.lua).
# The repo ships a default copy so a fresh install always has it. If it were
# missing, mpv would log an error for this line and keep going with the rest of
# the config; the script then falls back to the uosc original palette.
include="~~/sosc-palette.conf"

# Subtitle style, size and height chosen in the sosc subtitle menu (written by
# scripts/sosc-subs.lua). Same as the palette file: the repo ships a default copy
# (Original style, normal size and height), which sets no sub-* option at all.
# Keep this line after your own sub-* lines: when a style, size or height other
# than Original/Normal is picked, this file sets those options and must win.
include="~~/sosc-subs.conf"
