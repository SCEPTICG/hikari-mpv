# hikari-update.lua: tells you when a new hikari version is out (see https://scepticg.github.io/hikari-mpv/features/update-check/).
# It only tells you: it never downloads or installs anything by itself.
# no = never check: no request to GitHub at all, no notice, no button.
# Updating hikari replaces this file: to keep it off for good, put
#   script-opts-append=hikari-update-enabled=no
# in your own mpv.conf instead.
enabled=yes
# Hours between two checks (at least 1). Each check is one request to github.com.
interval_hours=24
