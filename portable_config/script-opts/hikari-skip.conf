# hikari-skip.lua: "Skip opening / ending" button, in hikari's language (see https://scepticg.github.io/hikari-mpv/features/skip/).
# Which chapters get the button. Titles are matched like uosc's chapter ranges:
#   openings: OP, Opening, "... OP", "... Opening", オープニング (only if another chapter follows)
#   endings:  ED, Ending, "ED ...", "Ending ...", "... ED", "... Ending", エンディング
#   intros:   Intro, "... Intro", Avant, Prologue (only if another chapter follows)
#   outros:   Outro, Closing, "Closing ...", Preview, PV (shown as "Skip preview")
openings=yes
endings=yes
intros=yes
outros=no
# Files without opening or ending chapters: ask AniSkip (https://aniskip.com) for
# the times. Only anime releases (`[Group] Show - 05 (1080p).mkv`, Seanime streams);
# the series name and episode number are sent to AniList (or Jikan) and AniSkip.
# Answers are kept in ~~/hikari-aniskip.json. See
# https://scepticg.github.io/hikari-mpv/features/skip/#aniskip
# no = only chapters, nothing is ever sent.
aniskip=yes
# Episodes of a series on your disk or a network share (never streams): when the
# next episode is the next entry of mpv's playlist (hikari-resume adds it with
# autoplay_next), the button at the end reads "Next episode ›" and plays it. It
# also shows for the last 5 % of an episode without a known ending, and after an
# AniSkip ending that leaves less than 10 seconds of the file.
# no = the button stays as it was ("Skip ending ›" only).
next_episode=yes
# Extra Lua patterns, separated by |, matched against the lower-case chapter title.
# Example: extra_openings=^op%d+$|^opening %d+$   (OP1, Opening 2)
# Keep them simple: a pattern with several `.-` or `.*` in a row can take very
# long on some titles and freeze this script. They come from this file only,
# never from the videos, but a careless one still hurts.
extra_openings=
extra_endings=
extra_intros=
extra_outros=
# Distance from the bottom-right corner, in pixels at scale 1. The default clears
# uosc's default timeline and controls bar (81 px) with a small gap.
margin_bottom=96
margin_right=16
font_size=18
# Background opacity (0 = transparent, 1 = opaque). Colours follow the active palette.
opacity=0.85
# Keep these equal to uosc's `scale` and `scale_fullscreen` if you change them there.
scale=1
scale_fullscreen=1.3
