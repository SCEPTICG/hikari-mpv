# suji's row of controls with hikari's buttons, the same ones uosc.conf has.
# suji is hikari's own interface, still being tested. The installers only
# install this file when suji is chosen as the interface (it is replaced on
# every update, like uosc.conf); with suji installed by hand, copy it to
# script-opts/suji.conf in mpv's configuration folder (portable_config/ for
# mpv.net and AnimeJaNai), or add the line below to the suji.conf you have.
# The row is suji's default since 0.7.0 (previous and next, which suji hides
# by itself without a playlist and at its ends, then the volume next to the
# time), with hikari's buttons where suji puts its `speed` element. The speed
# button is hikari's, so suji's own `speed` is left out: with both, the row
# would show two speed icons. The automatic skip button is `button:hikari-skip`
# instead of a `command:`: hikari-skip.lua sets it (set-button), marked while
# the automatic skip is on; without that message it takes no room. suji shows
# no tooltips, so the ones after `?` stay in English.
# See https://scepticg.github.io/hikari-mpv/compatibility/#hikari-with-suji-experimental
controls=pause,prev,next,volume,time,space,subtitles,audio,playlist,<video,audio>command:text_fields:script-binding hikari_subs/open-menu?Subtitle style,<video+user-data/hikari_upscale/available>command:auto_awesome:script-binding hikari_upscale/open-menu?Upscaling,<video,audio>command:speed:script-binding hikari_speed/open-menu?Speed,<video,audio>button:hikari-skip,<user-data/hikari_resume/available>command:history:script-binding hikari_resume/open-menu?Continue watching,command:palette:script-binding hikari_palettes/open-menu?Palettes,command:language:script-binding hikari_language/open-menu?Language,<user-data/hikari_update/available>command:system_update_alt:script-binding hikari_update/open-menu?Update hikari,more,fullscreen
