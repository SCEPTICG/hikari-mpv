# suji's row of controls with hikari's buttons, the same ones uosc.conf has.
# suji is hikari's own interface, still being tested. The installers only
# install this file when suji is chosen as the interface (it is replaced on
# every update, like uosc.conf); with suji installed by hand, copy it to
# script-opts/suji.conf in mpv's configuration folder (portable_config/ for
# mpv.net and AnimeJaNai), or add the line below to the suji.conf you have.
# The speed button is hikari's, so suji's own `speed` element is left out:
# with both, the row would show two speed icons.
# See https://scepticg.github.io/hikari-mpv/compatibility/#hikari-with-suji-experimental
controls=pause,time,space,subtitles,audio,playlist,gap,<video,audio>command:text_fields:script-binding hikari_subs/open-menu?Subtitle style,<video+user-data/hikari_upscale/available>command:auto_awesome:script-binding hikari_upscale/open-menu?Upscaling,<video,audio>command:speed:script-binding hikari_speed/open-menu?Speed,<user-data/hikari_resume/available>command:history:script-binding hikari_resume/open-menu?Continue watching,command:palette:script-binding hikari_palettes/open-menu?Palettes,<user-data/hikari_update/available>command:system_update_alt:script-binding hikari_update/open-menu?Update hikari,more,volume,fullscreen
