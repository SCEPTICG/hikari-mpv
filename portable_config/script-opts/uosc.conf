# hikari overrides for uosc. Anything not set here keeps uosc's default.
# Colours and opacity are not set here: hikari-palettes.lua manages them through
# ~~/hikari-palette.conf, and any `color=` or `opacity=` added here will be overridden.
# To change them, edit a palette (or its `opacity` table) in hikari-palettes.lua.

# Hide the interface together with the mouse cursor (after cursor-autohide).
autohide=yes

# Timeline: filled bar instead of uosc's thin line.
timeline_style=bar
# No striped cache indicator on the timeline: keeps the bar clean.
timeline_cache=no

# Controls, tuned for watching single episodes:
# - chapters button when the file has chapters (jump to opening, part B, ending)
# - no shuffle / loop buttons
# - prev / items / next (`,` means OR): with local files they always show and,
#   without a playlist, step through the file's folder and open the file browser;
#   with streams there is no folder, so they hide unless there is a playlist
# - no speed slider: a speed button opens a menu with fixed speeds (hikari-speed.lua)
# - subtitle style menu (hikari-subs.lua, icon text_fields), speed menu and palette
#   picker before fullscreen
# - Anime4K upscale menu (hikari-upscale.lua, icon auto_awesome), only for videos
#   and only when the Anime4K shaders are installed: the script sets
#   user-data/hikari_upscale/available (mpv 0.36+; older mpv never shows it, the
#   Ctrl+0..7 keys still work)
# - update button (hikari-update.lua, icon system_update_alt), only when a newer
#   hikari version is out and not dismissed: the script sets
#   user-data/hikari_update/available (mpv 0.36+; older mpv never shows it, Alt+u
#   still opens the menu)
# - the tooltips after `?` of these hikari buttons are written in English here;
#   hikari-language.lua puts them in hikari's language at run time (uosc does
#   not translate the tooltips of `command:` buttons by itself). Your own
#   buttons and the rest of this line are left as you write them.
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<has_chapter>chapters,<stream>stream-quality,gap,space,<has_playlist,!stream>prev,<has_playlist,!stream>items,<has_playlist,!stream>next,gap,<video,audio>command:text_fields:script-binding hikari_subs/open-menu?Subtitle style,<video+user-data/hikari_upscale/available>command:auto_awesome:script-binding hikari_upscale/open-menu?Upscaling,<video,audio>command:speed:script-binding hikari_speed/open-menu?Speed,command:palette:script-binding hikari_palettes/open-menu?Palettes,<user-data/hikari_update/available>command:system_update_alt:script-binding hikari_update/open-menu?Update hikari,fullscreen
