# sosc overrides for uosc. Anything not set here keeps uosc's default.
# Colours and opacity are not set here: sosc-palettes.lua manages them through
# ~~/sosc-palette.conf, and any `color=` or `opacity=` added here will be overridden.
# To change them, edit a palette (or its `opacity` table) in sosc-palettes.lua.

# Hide the interface together with the mouse cursor (after cursor-autohide).
autohide=yes

# Timeline: filled bar instead of uosc's thin line.
timeline_style=bar
# No striped cache indicator on the timeline: keeps the bar clean.
timeline_cache=no

# Controls, tuned for watching single episodes:
# - chapters button when the file has chapters (jump to opening, part B, ending)
# - no shuffle / loop buttons
# - prev / items / next (`,` means OR): with local files they always show and,
#   without a playlist, step through the file's folder and open the file browser;
#   with streams there is no folder, so they hide unless there is a playlist
# - no speed slider: a speed button opens a menu with fixed speeds (sosc-speed.lua)
# - subtitle style menu (sosc-subs.lua, icon text_fields), speed menu and palette
#   picker before fullscreen
# - Anime4K upscale menu (sosc-upscale.lua, icon auto_awesome), only for videos
#   and only when the Anime4K shaders are installed: the script sets
#   user-data/sosc_upscale/available (mpv 0.36+; older mpv never shows it, the
#   Ctrl+0..7 keys still work)
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<has_chapter>chapters,<stream>stream-quality,gap,space,<has_playlist,!stream>prev,<has_playlist,!stream>items,<has_playlist,!stream>next,gap,<video,audio>command:text_fields:script-binding sosc_subs/open-menu?Subtítulos,<video+user-data/sosc_upscale/available>command:auto_awesome:script-binding sosc_upscale/open-menu?Escalado,<video,audio>command:speed:script-binding sosc_speed/open-menu?Velocidad,command:palette:script-binding sosc_palettes/open-menu?Paletas,fullscreen
