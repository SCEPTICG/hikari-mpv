# sosc overrides for uosc. Anything not set here keeps uosc's default.
# Colours and opacity are not set here: sosc-palettes.lua manages them through
# ~~/sosc-palette.conf, and any `color=` or `opacity=` added here will be overridden.
# To change them, edit a palette (or its `opacity` table) in sosc-palettes.lua.

# Timeline: filled bar instead of uosc's thin line.
timeline_style=bar

# Controls, tuned for watching single episodes:
# - chapters button when the file has chapters (jump to opening, part B, ending)
# - no shuffle / loop buttons, and playlist navigation only when there is a playlist
# - no speed slider (a speed menu button is planned)
# - palette picker before fullscreen
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<has_chapter>chapters,<stream>stream-quality,gap,space,<has_playlist>prev,<has_playlist>items,<has_playlist>next,gap,command:palette:script-binding sosc_palettes/open-menu?Paletas,fullscreen
