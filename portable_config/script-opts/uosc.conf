# sosc overrides for uosc. Anything not set here keeps uosc's default.
# Colours and opacity are not set here: sosc-palettes.lua manages them through
# ~~/sosc-palette.conf, and any `color=` or `opacity=` added here will be overridden.
# To change them, edit a palette (or its `opacity` table) in sosc-palettes.lua.

# Timeline: filled bar instead of uosc's thin line.
timeline_style=bar
# No striped cache indicator on the timeline: keeps the bar clean.
timeline_cache=no

# Controls, tuned for watching single episodes:
# - chapters button when the file has chapters (jump to opening, part B, ending)
# - no shuffle / loop buttons
# - prev / items / next (`,` means OR): with local files they always show and,
#   without a playlist, step through the file's folder and open the file browser;
#   with streams there is no folder, so they hide unless there is a playlist
# - no speed slider: a speed button opens a menu with fixed speeds (sosc-speed.lua)
# - speed menu and palette picker before fullscreen
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<has_chapter>chapters,<stream>stream-quality,gap,space,<has_playlist,!stream>prev,<has_playlist,!stream>items,<has_playlist,!stream>next,gap,<video,audio>command:speed:script-binding sosc_speed/open-menu?Velocidad,command:palette:script-binding sosc_palettes/open-menu?Paletas,fullscreen
