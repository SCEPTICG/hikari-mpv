# sosc overrides for uosc. Anything not set here keeps uosc's default.
# Colours are not set here: sosc-palettes.lua manages them through ~~/sosc-palette.conf.

# uosc's default `controls`, plus a palette picker button before fullscreen.
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,gap,space,<video,audio>speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,command:palette:script-binding sosc_palettes/open-menu?Paletas,fullscreen
