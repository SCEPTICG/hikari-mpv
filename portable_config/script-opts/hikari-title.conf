# hikari-title.lua: readable titles for anime releases, local files and streamed URLs
# (see https://scepticg.github.io/hikari-mpv/features/titles/).
# no = leave mpv's title untouched.
enabled=yes
# yes = tidy release names, from local files, from the last part of a URL and
# from Seanime-style `filename=` parameters:
#   [SubsPlease] Sousou no Frieren - 05 (1080p) [ABCD1234].mkv -> Sousou no Frieren · E05
#   Show.Name.S01E01.1080p.WEB-DL-GRP.mkv                     -> Show Name · S1 E01
# The season and episode labels follow hikari's language (Alt+l): T1 E01 in Spanish.
# Names that do not look like a release are left to mpv.
# no = only streamed URLs get a title: the filename as it comes (without its
# video extension); local files keep mpv's own title.
pretty=yes
