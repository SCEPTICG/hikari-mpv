# hikari-title.lua: readable titles for streamed URLs (see https://scepticg.github.io/hikari-mpv/features/titles/).
# no = leave mpv's title untouched.
enabled=yes
# yes = tidy release names taken from `filename=`:
#   Show.Name.S01E01.1080p.WEB-DL-GRP -> Show Name · T1 E01
# no = show the filename as it comes (without its video extension).
pretty=yes
