# hikari-resume.lua: continue watching where you left off (see https://scepticg.github.io/hikari-mpv/features/resume/).
# Only for files (on your disk or a network share), never for streams: players
# like Seanime keep their own position. hikari never sends the list anywhere; it is
# hikari-resume.json in mpv's config folder.
# Updating hikari keeps this file as you left it.
# no = off: nothing is saved, nothing is asked and there is no button.
enabled=yes
# yes = when you open a file you left half-watched, mpv pauses and asks whether
# to continue or start from the beginning. no = it just continues, no question.
ask=yes
# How many rows the list remembers (1 to 100; a series is one row); the oldest go first.
history_size=30
# yes = when an episode of a series is the last entry of mpv's playlist, the
# next episode in its folder is added behind it, so mpv moves on to it at the
# end. no = mpv stops at the end of the episode as usual. Missing (a copy of
# this file from hikari 0.8): yes.
autoplay_next=yes
