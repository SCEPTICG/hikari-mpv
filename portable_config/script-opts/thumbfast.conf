# hikari settings for thumbfast (https://github.com/po5/thumbfast), which draws the
# timeline thumbnails in uosc. thumbfast itself is not bundled (MPL-2.0): the
# installer downloads it. Anything not set here keeps thumbfast's default.

# Thumbnails on network streams too (Seanime, debrid, URLs). thumbfast opens a
# second, hidden mpv with its own connection to the stream, so it uses some extra
# bandwidth and the first thumbnail can take a second or two.
network=yes

# Decode thumbnails on the GPU instead of the CPU.
hwdec=yes

# Only start the thumbnailer when the timeline is first hovered, not on every
# file load, so no extra connection is opened if thumbnails are never used.
spawn_first=no

# Maximum thumbnail size in pixels (scaled down to fit, scaled up with hidpi).
max_height=200
max_width=200
