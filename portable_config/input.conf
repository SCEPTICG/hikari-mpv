# sosc key bindings

# Palette picker. The script file is sosc-palettes.lua, but mpv turns `-` into `_`
# in script names, so the binding lives under `sosc_palettes`.
# No `#!` menu comment on purpose: as soon as input.conf has one, uosc builds its
# whole context menu from this file and drops its default menu.
# Alt+p rather than p: plain p pauses in stock mpv and is taken by some bundles.
Alt+p  script-binding sosc_palettes/open-menu

# Skip the current opening or ending (same as clicking the "Saltar opening/ending"
# button). Only does something while that button is on screen.
Alt+s  script-binding sosc_skip/skip
