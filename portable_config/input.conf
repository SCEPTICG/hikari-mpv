# sosc key bindings

# Palette picker. The script file is sosc-palettes.lua, but mpv turns `-` into `_`
# in script names, so the binding lives under `sosc_palettes`.
# No `#!` menu comment on purpose: as soon as input.conf has one, uosc builds its
# whole context menu from this file and drops its default menu.
# Alt+p rather than p: plain p pauses in stock mpv and is taken by some bundles.
Alt+p  script-binding sosc_palettes/open-menu

# Skip the current opening or ending (same as clicking the "Saltar opening/ending"
# button). Only does something while that button is on screen.
Alt+s  script-binding sosc_skip/skip

# Subtitle menu: style (Original, Caja oscura, Borde grueso, Amarillo clásico),
# size and height. Same as the subtitles button with the text icon in the controls bar.
Alt+t  script-binding sosc_subs/open-menu

# Anime4K modes (sosc-upscale.lua), the same keys as Anime4K's own instructions:
# A, B, C, A+A, B+B, C+A and off, plus Ctrl+7 for Automático (picks C, B or A+A
# from the height of each video). Only useful with the Anime4K shaders in
# ~~/shaders/ (the installer adds these lines only when it installs them; leave
# them out with AnimeJaNai, which uses Ctrl+1..9 for its own upscaling).
Ctrl+1  script-message-to sosc_upscale set-mode a
Ctrl+2  script-message-to sosc_upscale set-mode b
Ctrl+3  script-message-to sosc_upscale set-mode c
Ctrl+4  script-message-to sosc_upscale set-mode aa
Ctrl+5  script-message-to sosc_upscale set-mode bb
Ctrl+6  script-message-to sosc_upscale set-mode ca
Ctrl+7  script-message-to sosc_upscale set-mode auto
Ctrl+0  script-message-to sosc_upscale set-mode off
